spring.application.name=task-manager-backend

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/taskdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=pasindu
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jackson.serialization.write-dates-as-timestamps=false

app.jwt.secret=${JWT_SECRET:change-me-in-production-use-a-long-random-secret-key}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
