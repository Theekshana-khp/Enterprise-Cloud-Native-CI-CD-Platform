name: CI - Test, Build and Push to ECR

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 474632925843.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Download project code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Build React frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test Spring Boot backend
        working-directory: backend
        run: mvn -B test

      - name: Configure AWS login
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login Docker to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker images
        run: |
          docker build -t $ECR_REGISTRY/task-manager/frontend:$IMAGE_TAG ./frontend
          docker build -t $ECR_REGISTRY/task-manager/backend:$IMAGE_TAG ./backend

      - name: Push Docker images to ECR
        run: |
          docker push $ECR_REGISTRY/task-manager/frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/task-manager/backend:$IMAGE_TAG
